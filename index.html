<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Muhammad Zul Rezky Zaaki | Data Analyst & AI Engineer</title>
    <meta
      name="description"
      content="Portfolio of Muhammad Zul Rezky Zaaki, Data Analyst & AI Engineer. Deep learning, computer vision, and data-driven projects."
    />
    <meta name="theme-color" content="#141413" />
    <script>
      // Pasang tema sebelum halaman tampil supaya tidak berkedip
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <meta
      property="og:title"
      content="Muhammad Zul Rezky Zaaki | Data Analyst & AI Engineer"
    />
    <meta
      property="og:description"
      content="Deep learning, computer vision, and data-driven projects."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
